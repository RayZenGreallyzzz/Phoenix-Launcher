name: Build Phoenix PPA Native APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "games/ppa-native/**"
      - ".github/workflows/godot-ppa-android.yml"

jobs:
  build-ppa-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.6"
      GODOT_STATUS: "stable"
    steps:
      - uses: actions/checkout@v4

      - name: Verify Phoenix game-ticket backend is deployed
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ppa-phoenixpixarena.1988stella1988.workers.dev"
          R1="$(curl --silent --show-error -X POST "$BASE/api/launcher/game-ticket" -H "content-type: application/json" --data '{"gameId":"phoenix-pix-arena"}')"
          echo "$R1"
          echo "$R1" | grep -q "PHOENIX_SESSION_MISSING"
          R2="$(curl --silent --show-error -X POST "$BASE/api/game/session/exchange" -H "content-type: application/json" --data '{"gameId":"phoenix-pix-arena","ticket":"invalid"}')"
          echo "$R2"
          echo "$R2" | grep -q "GAME_TICKET_INVALID"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;35.0.0"

      - name: Cache stable PPA debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/ppa-native-debug.keystore
          key: ppa-native-debug-keystore-v1

      - name: Ensure stable PPA debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/ppa-native-debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/ppa-native-debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Phoenix Pix Arena Debug,O=Phoenix,C=UA"
          fi

      - name: Download Godot 4.6 and export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          curl -L --fail --retry 3 -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          sudo ln -sf "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" /usr/local/bin/godot
          curl -L --fail --retry 3 -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          godot --version

      - name: Configure Godot Android export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/timestamping_authority_url = ""
          export/android/shutdown_timestamping = true
          EOF
          cp "$HOME/.config/godot/editor_settings-4.tres" "$HOME/.config/godot/editor_settings-4.6.tres"
          sed -i 's|keystore/debug=""|keystore/debug="'"$HOME"'/.android/ppa-native-debug.keystore"|' games/ppa-native/export_presets.cfg
          sed -i 's|keystore/debug_user=""|keystore/debug_user="androiddebugkey"|' games/ppa-native/export_presets.cfg
          sed -i 's|keystore/debug_password=""|keystore/debug_password="android"|' games/ppa-native/export_presets.cfg

      - name: Fetch and verify exact deployed PPA Peace City map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p games/ppa-native/assets
          curl -L --fail --retry 4 --retry-delay 2 \
            -o games/ppa-native/assets/peace_city.png \
            "https://ppa-phoenixpixarena.1988stella1988.workers.dev/assets/c73ef6814017bda6.png"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,struct
          p=Path('games/ppa-native/assets/peace_city.png')
          data=p.read_bytes()
          assert data[:8]==bytes.fromhex('89504e470d0a1a0a'), 'PPA city payload is not a PNG'
          assert struct.unpack('>II', data[16:24])==(1254,1254), 'Unexpected city artwork dimensions'
          expected='c73ef6814017bda644fe86e01222eacf54b2aa7e68760ed3f7b17edfbff05105'
          actual=hashlib.sha256(data).hexdigest()
          assert actual==expected, 'City art changed; refusing to ship a mismatched town'
          print('Verified live PPA Peace City',len(data),'bytes', '1254x1254',actual)
          PY

      - name: Import native PPA project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path games/ppa-native --editor --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -Eq 'SCRIPT ERROR: Parse Error|Failed to load script' /tmp/godot-import.log; then
            echo "Godot parse/load failure; refusing to publish."
            exit 1
          fi
          MAP_IMPORT="games/ppa-native/assets/peace_city.png.import"
          test -s "$MAP_IMPORT"
          if grep -q 'valid=false' "$MAP_IMPORT"; then
            echo "Imported current PPA Peace City map is invalid."
            cat "$MAP_IMPORT"
            exit 1
          fi
          grep -q 'path=' "$MAP_IMPORT"

      - name: Build native PPA APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --verbose --path games/ppa-native --export-debug "Android" "$GITHUB_WORKSPACE/build/PhoenixPixArena-native-debug.apk" 2>&1 | tee build/godot-export.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" build/godot-export.log; then
            echo "Godot script parse error detected; refusing to publish broken APK."
            exit 1
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s build/PhoenixPixArena-native-debug.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose build/PhoenixPixArena-native-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoenixPixArena-native-debug
          path: build/PhoenixPixArena-native-debug.apk
          if-no-files-found: error
          retention-days: 90
