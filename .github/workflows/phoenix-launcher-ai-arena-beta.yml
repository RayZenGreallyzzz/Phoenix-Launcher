name: Phoenix Launcher matching AI Arena Beta (no release)

on:
  workflow_dispatch:
  push:
    branches: [ feature/ppa-native-arena-npc-practice-20261010 ]
    paths:
      - "app/**"
      - ".github/workflows/phoenix-launcher-ai-arena-beta.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore stable Phoenix debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: phoenix-launcher-debug-keystore-v1

      - name: Ensure stable Phoenix debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Phoenix Launcher Debug,O=Phoenix,C=UA"
          fi
          echo "PHOENIX_DEBUG_SHA256:"
          keytool -list -v             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey | grep "SHA256:"

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PhoenixLauncher-AI-Arena-BETA
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
