name: Android Runtime Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-runtime-smoke.yml"

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Boot emulator and reproduce login crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eux
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.phoenixgames.launcher/.MainActivity
            sleep 4
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml window.xml || true
            cat window.xml || true
            python3 - <<'PY'
            import re, subprocess, time, os
            p='window.xml'
            if os.path.exists(p):
                s=open(p,encoding='utf-8',errors='ignore').read()
                m=re.search(r'text="[^"]*Войти через Telegram[^"]*"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',s)
                if not m:
                    m=re.search(r'content-desc="[^"]*Войти через Telegram[^"]*"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',s)
                if m:
                    x=(int(m.group(1))+int(m.group(3)))//2
                    y=(int(m.group(2))+int(m.group(4)))//2
                else:
                    x,y=540,1220
            else:
                x,y=540,1220
            print("TAP",x,y)
            subprocess.run(["adb","shell","input","tap",str(x),str(y)],check=False)
            time.sleep(4)
            PY
            echo "PID:"
            adb shell pidof com.phoenixgames.launcher || true
            echo "TOP ACTIVITY:"
            adb shell dumpsys activity activities | grep -m 5 -E "mResumedActivity|topResumedActivity|com.phoenixgames.launcher" || true
            echo "CRASH LOG:"
            adb logcat -d -v time | grep -A 60 -B 10 -E "FATAL EXCEPTION|AndroidRuntime|com.phoenixgames.launcher" | tail -n 220 || true
